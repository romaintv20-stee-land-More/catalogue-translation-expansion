name: Build and QA

on:
  push:
    branches: [ main, "dev/**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and validate all release JARs
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-translation-expansion-jars
          path: |
            dist/*.jar
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/build-report.json
